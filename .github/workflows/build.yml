name: Upload Binary

on:
  workflow_dispatch:
    inputs:
      tag: 
        required: true
        type: string

jobs:
  build:
    name: Build & Upload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.tag }} 
          path: ./target/release/dwm_eotf_rs.exe
