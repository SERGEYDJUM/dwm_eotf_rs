name: Build & Upload Binary

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
  build:
    name: Build & Upload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: certutil -hashfile ./target/release/dwm_eotf_rs.exe SHA256
      - run: gh release upload ${{ github.ref_name }} ./target/release/dwm_eotf_rs.exe
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
